[workspace]
resolver = "3"
members = ["crates/dz-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["DiZero contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CtrlTsuki/dizero"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Release profile tuned for size and memory. `panic = "unwind"` is deliberate:
# the plugin host relies on catch_unwind to contain host-side panics, which
# `panic = "abort"` would turn into a whole-app crash. See docs/decisions/0004.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
